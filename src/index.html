<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Article NER Service Panel</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 30px auto; max-width: 850px; padding: 0 20px; color: #222; }
    h1 { margin-bottom: 8px; }
    p.desc { color: #666; margin-top: 0; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; }
    input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    textarea { height: 180px; resize: vertical; }
    button { background-color: #0066cc; color: #fff; border: none; padding: 10px 20px; font-size: 14px; border-radius: 4px; cursor: pointer; }
    button:disabled { background-color: #999; cursor: not-allowed; }
    #spinner { display: none; margin-left: 10px; color: #666; font-size: 14px; }
    #error-box { display: none; margin-top: 15px; padding: 12px; background-color: #ffebe8; border: 1px solid #ff4d4f; border-radius: 4px; color: #d9363e; }
    #result-box { display: none; margin-top: 25px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background-color: #f7f7f7; }
    .badge { background-color: #e6f7ff; color: #0050b3; border: 1px solid #91d5ff; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Article Named-Entity Recognition</h1>
  <p class="desc">Enter an article title and body below to extract named entities.</p>

  <form id="ner-form">
    <div class="form-group">
      <label for="title">Article Title</label>
      <input type="text" id="title" placeholder="e.g. Google Expands Cloud Infrastructure in Singapore" required>
    </div>
    <div class="form-group">
      <label for="body">Article Body</label>
      <textarea id="body" placeholder="Paste full article text here..." required></textarea>
    </div>
    <div>
      <button type="submit" id="submit-btn">Extract Entities</button>
      <span id="spinner">Processing text...</span>
    </div>
  </form>

  <div id="error-box"></div>

  <div id="result-box">
    <h2>Extracted Entities (<span id="count">0</span>)</h2>
    <p><strong>Model:</strong> <span id="model-name">-</span></p>
    <table>
      <thead>
        <tr>
          <th>Entity Text</th>
          <th>Type / Label</th>
          <th>Start Char</th>
          <th>End Char</th>
        </tr>
      </thead>
      <tbody id="entities-table-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('ner-form');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');
    const errorBox = document.getElementById('error-box');
    const resultBox = document.getElementById('result-box');
    const tbody = document.getElementById('entities-table-body');
    const countSpan = document.getElementById('count');
    const modelSpan = document.getElementById('model-name');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';
      tbody.innerHTML = '';

      const title = document.getElementById('title').value.trim();
      const body = document.getElementById('body').value.trim();

      if (!title || !body) {
        errorBox.textContent = "Title and body cannot be empty.";
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      spinner.style.display = 'inline';

      try {
        const res = await fetch('/extract-entities', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, body })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to process request.");
        }

        countSpan.textContent = data.meta.entity_count;
        modelSpan.textContent = data.meta.model;

        if (data.entities.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">No named entities found.</td></tr>';
        } else {
          data.entities.forEach(ent => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${ent.text}</strong></td>
              <td><span class="badge">${ent.label}</span></td>
              <td>${ent.start}</td>
              <td>${ent.end}</td>
            `;
            tbody.appendChild(tr);
          });
        }
        resultBox.style.display = 'block';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
